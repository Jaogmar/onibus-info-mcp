[project]
name = "onibus-mcp"
version = "0.1.0"
description = "Servidor MCP para consultar rotas, linhas e horarios de onibus de Joinville/SC (onibus.info)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.2.0",
    "httpx>=0.27",
    "tzdata>=2024.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onibus_mcp"]
